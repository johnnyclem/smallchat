name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # packages/react/src/app-view.browser.test.ts runs a real MCP Apps view
      # against AppView in Chromium; SMALLCHAT_BROWSER_TESTS=1 makes a missing
      # browser a failure instead of a skip.
      - name: Install Chromium (headless shell)
        run: npx playwright-core install --with-deps --only-shell chromium

      - name: Test
        run: npm test
        env:
          SMALLCHAT_BROWSER_TESTS: '1'

      # shorthand/ is a byte-for-byte mirror of @shorthand/core from the
      # short-hand repository (scripts/sync-shorthand.mjs). SOURCE records
      # the short-hand commit; check that commit out (this fails when it was
      # never pushed) and fail when the mirror differs from it or from
      # SOURCE, or from the published package once that version is on npm.
      - name: Read the mirrored short-hand commit
        id: shorthand
        run: |
          echo "commit=$(sed -n 's/^commit: //p' shorthand/SOURCE)" >> "$GITHUB_OUTPUT"

      - name: Check out short-hand at that commit
        uses: actions/checkout@v4
        with:
          repository: johnnyclem/short-hand
          ref: ${{ steps.shorthand.outputs.commit }}
          path: .short-hand-upstream

      - name: Check the @shorthand/core mirror
        run: npm run check:shorthand -- --registry
        env:
          SHORTHAND_DIR: .short-hand-upstream

      # The mirror's own suite (compaction, CRDT properties, importance,
      # truth format v2 conformance) is not globbed by the root vitest config.
      - name: Test shorthand
        run: npm test --workspace=shorthand

      - name: Build core
        run: npm run build

      # Golden dispatch traces (examples/traces/) against an artifact compiled
      # from examples/*-manifest.json: exit 1 on any changed decision.
      - name: Replay golden traces
        run: npm run test:traces

      - name: Build workspace packages
        run: npm run build:packages

      # Pack @smallchat/core as it would be published, install the tarball
      # into an empty project and load every export and the CLI there.
      - name: Published package installs and loads
        run: npm run test:pack

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails only on critical-severity findings; see CHANGELOG.md for
      # accepted-risk items (e.g. adm-zip via onnxruntime-node's
      # install-time-only postinstall script).
      - name: Audit (critical)
        run: npm audit --audit-level=critical

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/docs/package-lock.json

      # packages/docs carries its own package-lock.json and is not part
      # of the root npm workspace, so it needs its own install/build/audit
      # here rather than being covered by the jobs above.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit (critical)
        run: npm audit --audit-level=critical

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      # shorthand/ is a workspace member (not a standalone install like
      # packages/docs) but its own test suite — compaction, CRDT, and
      # importance-scoring, ~260 specs — was never run by root `npm test`,
      # since the root vitest.config.ts only globs the root src/. Run it
      # explicitly so this coverage is actually checked in CI.
      - name: Test shorthand
        run: npm test --workspace=shorthand

      - name: Build core
        run: npm run build

      - name: Build workspace packages
        run: npm run build:packages

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails only on critical-severity findings; see CHANGELOG.md for
      # accepted-risk items (e.g. adm-zip via onnxruntime-node's
      # install-time-only postinstall script).
      - name: Audit (critical)
        run: npm audit --audit-level=critical

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/docs/package-lock.json

      # packages/docs carries its own package-lock.json and is not part
      # of the root npm workspace, so it needs its own install/build/audit
      # here rather than being covered by the jobs above.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit (critical)
        run: npm audit --audit-level=critical
